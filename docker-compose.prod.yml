# ComplianceOS Production Deployment
# Uses pre-built image and connects to host Supabase database
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  app:
    image: complianceos:latest
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgres://postgres:postgres@host.docker.internal:54322/postgres?sslmode=disable
      - AUTH_MODE=local
      - VITE_ENABLE_PREMIUM=true
      - APP_ENCRYPTION_KEY=change-me-to-a-random-32-char-key-1234567890ab
      - ENCRYPTION_KEY=change-me-to-a-random-32-char-key-1234567890ab
      - SUPABASE_URL=https://placeholder.supabase.co
      - SUPABASE_SERVICE_ROLE_KEY=placeholder
      - VITE_SUPABASE_URL=https://placeholder.supabase.co
      - VITE_SUPABASE_ANON_KEY=placeholder
      - COMPLIANCE_ADMIN_EMAIL=admin@complianceos.local
      - COMPLIANCE_ADMIN_PASSWORD=Admin@ComplianceOS1
      - NO_TELEMETRY=true
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
