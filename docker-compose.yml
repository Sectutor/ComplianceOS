services:
  app:
    build: .
    ports:
      - "3005:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgres://postgres:postgres@db:5432/complianceos
      # Supabase Config - Required for Authentication
      # Replace these with your actual Supabase credentials in a .env file or environment
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://placeholder.supabase.co}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-placeholder}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-placeholder}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-to-a-random-32-char-key}
      - AUTH_MODE=${AUTH_MODE:-local}
      - LOCAL_JWT_SECRET=${LOCAL_JWT_SECRET:-change-me-to-a-secure-secret}
      - COMPLIANCE_ADMIN_EMAIL=${COMPLIANCE_ADMIN_EMAIL:-admin@complianceos.local}
      - COMPLIANCE_ADMIN_PASSWORD=${COMPLIANCE_ADMIN_PASSWORD:-Admin@ComplianceOS1}
      - VITE_ENABLE_PREMIUM=${VITE_ENABLE_PREMIUM:-false}
      - NO_TELEMETRY=${NO_TELEMETRY:-true}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-change-me-to-a-random-32-char-key}
      - HERMES_DASHBOARD_URL=http://host.docker.internal:9119  # For /agent-full iframe
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - complianceos-network
    command: npx tsx server_entry.ts
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=complianceos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d complianceos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - complianceos-network

  hermes-agent:
    build: ./docker/hermes-agent
    ports:
      - "9090:9090"
      - "9118:9118"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - COMPLIANCE_API_KEY=${COMPLIANCE_API_KEY:-test-api-key-for-local-dev}
      - COMPLIANCE_API_URL=http://app:3001/api/v1
    restart: unless-stopped
    networks:
      - complianceos-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cisovault:
    image: cisovault:latest
    container_name: complianceos-cisovault-1
    ports:
      - "3099:3099"
    restart: unless-stopped
    networks:
      - complianceos-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3099/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  cisovault-sync:
    build: ./docker/sync
    environment:
      - CISOVAULT_URL=http://cisovault:3099
      - GRC_API_URL=http://app:3001/api/v1
      - GRC_API_KEY=test-api-key-for-local-dev
      - GRC_DEFAULT_CLIENT_ID=1
    restart: unless-stopped
    depends_on:
      cisovault:
        condition: service_started
      app:
        condition: service_started
    networks:
      - complianceos-network
networks:
  complianceos-network:
    name: complianceos-network

volumes:
  db_data:
