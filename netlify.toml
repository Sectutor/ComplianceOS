[build]
  base = "."
  command = "npm install && npm run build -w @complianceos/core"
  publish = "packages/core/dist"

[build.environment]
  NPM_FLAGS = "--include=dev"
  NODE_OPTIONS = "--max-old-space-size=4096"
  PYTHON_VERSION = "3.12"
  SECRETS_SCAN_OMIT_PATHS = ".netlify,node_modules"

[functions]

[functions.node_bundle]
  external_node_modules = ["postgres", "pdf-parse", "puppeteer", "docx", "archiver", "xlsx", "turndown", "openai"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
