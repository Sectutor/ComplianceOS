# TheHive Configuration
# PREMIUM FEATURE — Incident Response Case Management

# Database configuration
db {
  provider = postgres-pg
  postgres {
    driver = org.postgresql.Driver
    uri = ${?THEHIVE_DB_URI}
  }
}

# Cortex integration
cortex {
  # URL of the Cortex server
  url = ${?CORTEX_URL}
  # API key for TheHive to authenticate with Cortex
  key = ${?CORTEX_API_KEY}
  # Refresh interval for Cortex status
  refresh = 30s
}

# Storage configuration
storage {
  provider = local
  local {
    directory = /opt/thehive/data
  }
}

# Attachment configuration
attachment {
  # Max file size for attachments
  max-size = 50MB
}

# Audit log configuration
audit {
  enabled = true
  # Log all search queries
  search = true
}

# Stream/WebSocket configuration
stream {
  # Enable SSE for real-time updates
  enabled = true
}

# Authentication
auth {
  provider = local
}
