# Cortex Configuration
# PREMIUM FEATURE — Incident Response Analyzer Engine

play {
  ws {
    user-agent = "Cortex"
    timeout = 30s
    timeout-deadline = 60s
  }
}

# Database configuration
db {
  provider = slick
  slick {
    db {
      driver = org.postgresql.Driver
      url = "jdbc:postgresql://thehive-db:5432/cortex"
      user = cortex
      password = ${?CORTEX_DB_PASSWORD}
    }
  }
}

# Analyzer configuration
analyzer {
  # Directory where analyzers are stored
  urls = ["https://raw.githubusercontent.com/TheHive-Project/Cortex-Analyzers/master"]
  # Enable automatic analyzer updates
  auto-update = true
}

# Job configuration
job {
  # Directory for job temp files
  directory = /opt/cortex/files
  # Max execution time for a job
  timeout = 10m
}

# Authentication
auth {
  # Enable local authentication (API key-based)
  provider = [local]
}
