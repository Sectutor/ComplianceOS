        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Governance]
      summary: Create governance task
      description: Creates a new governance task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, clientId]
              properties:
                title:
                  type: string
                status:
                  type: string
                  enum: [pending, in_progress, completed, overdue]
                priority:
                  type: string
                  enum: [high, medium, low]
                clientId:
                  type: integer
      responses:
        '200':
          description: Created governance task
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /governance/tasks/{id}:
    patch:
      tags: [Governance]
      summary: Update governance task
      description: Partially updates a governance task.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceTask'
      responses:
        '200':
          description: Updated task
        '500':
          $ref: '#/components/responses/InternalError'

  /governance/summary:
    get:
      tags: [Governance]
      summary: Get governance summary
      description: Returns governance task statistics.
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Governance summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceSummary'
        '500':
          $ref: '#/components/responses/InternalError'

  /governance/autopilot:
    post:
      tags: [Governance]
      summary: Run autopilot
      description: Triggers the autopilot engine to auto-generate governance tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: integer
      responses:
        '200':
          description: Autopilot result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutopilotResult'
        '500':
          $ref: '#/components/responses/InternalError'

  /governance/program-guide/{clientId}:
    get:
      tags: [Governance]
      summary: Get program guide
      description: Returns the governance program guide for a client.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Program guide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramGuide'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Incidents ──────────────────────────────────────────────────────────────

  /incidents:
    get:
      tags: [Incidents]
      summary: List incidents
      description: Returns all security incidents.
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, investigating, contained, closed]
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [critical, high, medium, low]
      responses:
        '200':
          description: List of incidents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /incidents/{id}:
    get:
      tags: [Incidents]
      summary: Get incident by ID
      description: Returns a single security incident.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Incident details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

# ── Reusable Responses ──────────────────────────────────────────────────────

components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Invalid control id"
            code: "BAD_REQUEST"

    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Invalid API key"
            code: "UNAUTHORIZED"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Resource not found"
            code: "NOT_FOUND"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Database connection failed"
            code: "INTERNAL_ERROR"

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
