        '500':
          $ref: '#/components/responses/InternalError'

  # ── Clients ────────────────────────────────────────────────────────────────

  /clients:
    get:
      tags: [Clients]
      summary: List clients
      description: Returns all clients.
      responses:
        '200':
          description: List of clients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Clients]
      summary: Create client
      description: Creates a new client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                industry:
                  type: string
                  nullable: true
                framework:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Created client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/{id}:
    get:
      tags: [Clients]
      summary: Get client by ID
      description: Returns a single client.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Client details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Assets ─────────────────────────────────────────────────────────────────

  /assets:
    get:
      tags: [Assets]
      summary: List assets
      description: Returns all assets.
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: List of assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /assets/{id}:
    get:
      tags: [Assets]
      summary: Get asset by ID
