# ComplianceOS REST API v1
# OpenAPI 3.0.3 specification — auto-generated from api-v1.ts routes
openapi: 3.0.3
info:
  title: ComplianceOS API v1
  description: |
    REST API for ComplianceOS — GRC platform for compliance automation.
    
    All endpoints require an API key via the `x-api-key` header (unless running in open-dev mode).
    
    Base URL: `/api/v1`
  version: 1.0.0
  contact:
    name: ComplianceOS Support
  license:
    name: Commercial

servers:
  - url: /api/v1
    description: Current server

security:
  - ApiKeyAuth: []

tags:
  - name: System
    description: Health and system status
  - name: Controls
    description: Compliance controls management
  - name: Evidence
    description: Evidence collection and management
  - name: Risks
    description: Risk register and treatment
  - name: Vendors
    description: Third-party vendor management
  - name: Assets
    description: Asset inventory
  - name: Clients
    description: Client management
  - name: Policies
    description: Policy management and attestations
  - name: Tasks
    description: Task management
  - name: Audits
    description: Audit management and findings
  - name: Privacy
    description: GDPR DSAR and DPIA
  - name: Employees
    description: Employee management
  - name: Governance
    description: Governance workflows and autopilot
  - name: Incidents
    description: Security incident management
  - name: Frameworks
    description: Compliance frameworks
  - name: Reports
    description: Compliance reporting

paths:
  # ── System ─────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [System]
      summary: Health check
      description: Returns system health including database connectivity and latency.
      security: []  # No auth required
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ── Controls ───────────────────────────────────────────────────────────────

  /controls:
    get:
      tags: [Controls]
      summary: List controls
      description: Returns all compliance controls, optionally filtered by framework.
      parameters:
        - name: framework
          in: query
          required: false
          schema:
            type: string
          example: "SOC 2"
      responses:
        '200':
          description: List of controls
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Control'
                  total:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /controls/{id}:
    get:
      tags: [Controls]
      summary: Get control by ID
      description: Returns a single control with its linked evidence count.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 101
      responses:
        '200':
          description: Control details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Control'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Evidence ───────────────────────────────────────────────────────────────

  /evidence:
    get:
      tags: [Evidence]
      summary: List evidence
      description: Returns all evidence records.
      responses:
        '200':
          description: List of evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Evidence]
      summary: Create evidence
      description: Creates a new evidence record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, clientControlId, evidenceId]
              properties:
                clientId:
                  type: integer
                clientControlId:
                  type: integer
                evidenceId:
                  type: string
                description:
                  type: string
                  nullable: true
                framework:
                  type: string
                  nullable: true
                type:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [pending, approved, rejected, expired]
                dueDate:
                  type: string
                  format: date-time
                  nullable: true
                fileCount:
                  type: integer
      responses:
        '200':
          description: Created evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /evidence/{id}:
    delete:
      tags: [Evidence]
      summary: Delete evidence
      description: Deletes an evidence record by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deletion result
        '500':
          $ref: '#/components/responses/InternalError'

  /evidence/requests:
    get:
      tags: [Evidence]
      summary: List evidence requests
      description: Returns all evidence requests.
      responses:
        '200':
          description: List of evidence requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Evidence]
      summary: Create evidence request
      description: Creates a new evidence request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                controlId:
                  type: string
                description:
                  type: string
                clientId:
                  type: integer
      responses:
        '200':
          description: Created evidence request
        '500':
          $ref: '#/components/responses/InternalError'

  /evidence/{id}/files:
    post:
      tags: [Evidence]
      summary: Upload evidence file
      description: Uploads a file for an evidence record.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload result
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Risks ──────────────────────────────────────────────────────────────────

  /risks:
    get:
      tags: [Risks]
      summary: List risks
      description: Returns all risk scenarios.
      responses:
        '200':
          description: List of risks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Risks]
      summary: Create risk
      description: Creates a new risk scenario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, clientId]
              properties:
                title:
                  type: string
                description:
                  type: string
                  nullable: true
                likelihood:
                  type: integer
                  minimum: 1
                  maximum: 5
                impact:
                  type: integer
                  minimum: 1
                  maximum: 5
                owner:
                  type: string
                  nullable: true
                clientId:
                  type: integer
      responses:
        '200':
          description: Created risk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Risk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /risks/{id}:
    get:
      tags: [Risks]
      summary: Get risk by ID
      description: Returns a single risk scenario.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Risk details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Risk'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Risks]
      summary: Update risk
      description: Partially updates a risk scenario.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Risk'
      responses:
        '200':
          description: Updated risk
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Risks]
      summary: Delete risk
      description: Deletes a risk scenario.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deletion result
        '500':
          $ref: '#/components/responses/InternalError'

  /risks/appetite:
    get:
      tags: [Risks]
      summary: Get risk appetite
      description: Returns risk appetite thresholds and current scores.
      responses:
        '200':
          description: Risk appetite data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RiskAppetite'
        '500':
          $ref: '#/components/responses/InternalError'

  /risks/assessments:
    post:
      tags: [Risks]
      summary: Create risk assessment
      description: Creates a new risk assessment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskAssessment'
      responses:
        '200':
          description: Created assessment
        '500':
          $ref: '#/components/responses/InternalError'

  /treatments:
    get:
      tags: [Risks]
      summary: List risk treatments
      description: Returns all risk treatment plans.
      responses:
        '200':
          description: List of treatments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Risks]
      summary: Create risk treatment
      description: Creates a new risk treatment plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [riskId, title]
              properties:
                riskId:
                  type: integer
                title:
                  type: string
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [planned, in_progress, completed]
                priority:
                  type: string
                  enum: [high, medium, low]
                dueDate:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          description: Created treatment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskTreatment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Frameworks ─────────────────────────────────────────────────────────────

  /frameworks:
    get:
      tags: [Frameworks]
      summary: List frameworks
      description: Returns all available compliance frameworks.
      responses:
        '200':
          description: List of frameworks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Framework'
        '500':
          $ref: '#/components/responses/InternalError'

  /gaps:
    get:
      tags: [Frameworks]
      summary: List compliance gaps
      description: Returns compliance gaps, optionally filtered by framework.
      parameters:
        - name: framework
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of gaps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '500':
