      tags: [Privacy]
      summary: List DSAR requests
      description: Returns all Data Subject Access Requests.
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: List of DSAR requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DsarRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Privacy]
      summary: Create DSAR request
      description: Creates a new Data Subject Access Request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requesterEmail, requestType, clientId]
              properties:
                requesterEmail:
                  type: string
                  format: email
                requestType:
                  type: string
                  enum: [access, deletion, portability]
                clientId:
                  type: integer
      responses:
        '200':
          description: Created DSAR
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /privacy/dpia:
    get:
      tags: [Privacy]
      summary: List DPIAs
