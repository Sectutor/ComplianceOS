  /auditor-questions:
    get:
      tags: [Frameworks]
      summary: List auditor questions
      description: Returns auditor questions, optionally filtered by framework.
      parameters:
        - name: framework
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of auditor questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Reports ────────────────────────────────────────────────────────────────

  /report:
    get:
      tags: [Reports]
      summary: Get compliance report
      description: Returns a compliance report for a client/framework.
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
        - name: framework
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Compliance report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'
        '500':
          $ref: '#/components/responses/InternalError'

  /summary:
    get:
      tags: [Reports]
      summary: Get compliance summary
      description: Returns a high-level compliance summary.
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
