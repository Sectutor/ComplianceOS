[package]
name = "complianceos-desktop"
version = "1.0.0"
description = "ComplianceOS Desktop - Self-hosted GRC Platform"
authors = ["ComplianceOS"]
edition = "2021"

[lib]
name = "complianceos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-window = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
