name: CI

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

jobs:
  verify:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Tests are self-contained (mocked DB) but setup files read DATABASE_URL;
      # provide an inert placeholder so nothing attempts a real connection.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_placeholder
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (core + ui)
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test (vitest, incl. link-integrity gate)
        run: npm test

      - name: Build (community edition)
        run: npm run build -w @complianceos/core
